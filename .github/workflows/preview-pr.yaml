# Build the site of a PR. It runs the PR code, so it has no secrets and a
# read-only token: preview-deploy.yaml publishes the result.
name: preview-pr

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  # Tells preview-deploy.yaml which PR to comment on
  pr-number:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.number }}" > pr-number
      - uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number
